<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cajero — Retiro por metodología de acarreo</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/resultados.css">
    <link rel="stylesheet" href="css/tablas.css">
  </head>
  <body>
    <div class="machine">
      <div class="brand">
        <div class="brand-name"><b>BANCO</b> DEMO</div>
        <div class="brand-tag">retiro · metodología de acarreo</div>
      </div>

      <div class="screen">
        <!-- PASO 0: selección de tipo de retiro -->
        <div id="stepTipo">
          <div class="field-label">Seleccione el tipo de retiro</div>
          <div class="tipo-grid">
            <button class="tipo-card" data-tipo="nequi">
              <span class="tipo-title">Nequi</span>
              <span class="tipo-sub"
                >Retiro por número de celular · clave temporal</span
              >
            </button>
            <button class="tipo-card" data-tipo="mano">
              <span class="tipo-title">Ahorro a la mano</span>
              <span class="tipo-sub">Número de 11 dígitos + clave</span>
            </button>
            <button class="tipo-card" data-tipo="cuenta">
              <span class="tipo-title">Cuenta de ahorros</span>
              <span class="tipo-sub">Número de cuenta + clave</span>
            </button>
          </div>
        </div>

        <!-- PASO 1: formulario dinámico -->
        <div id="stepForm" hidden>
          <button id="backBtn" class="link-btn">
            &larr; Cambiar tipo de retiro
          </button>
          <div id="formTitle" class="form-title"></div>

          <div id="camposIdentidad"></div>

          <div class="field-label" style="margin-top: 16px">
            Monto a retirar
          </div>
          <div class="chips" id="chipsMonto">
            <button class="chip" data-monto="20000">$20.000</button>
            <button class="chip" data-monto="50000">$50.000</button>
            <button class="chip" data-monto="100000">$100.000</button>
            <button class="chip" data-monto="150000">$150.000</button>
            <button class="chip" data-monto="200000">$200.000</button>
            <button class="chip" data-monto="otro">Otro valor</button>
          </div>
          <div class="amount-row" id="otroValorRow" hidden>
            <span class="currency">$</span>
            <input
              id="otroValorInput"
              type="text"
              inputmode="numeric"
              placeholder="Ej: 90.000"
              autocomplete="off"
              disabled
            />
          </div>
          <div class="limit-note">
            Máximo $1.000.000 · billetes disponibles: $10.000, $20.000, $50.000,
            $100.000
          </div>

          <div class="actions">
            <button id="retirarBtn" disabled>Retirar</button>
          </div>
        </div>

        <!-- PASO 2: resultado (éxito o error) -->
        <div id="stepResultado" hidden>
          <div id="resultadoContenido"></div>
          <div class="actions">
            <button id="nuevoRetiroBtn">Nuevo retiro</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
